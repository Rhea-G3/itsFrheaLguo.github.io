<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhea Guo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #f8f9fb;
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 40px;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #1f2937;
      font-weight: 600;
    }

    nav a:hover {
      color: #2563eb;
    }

    .hero {
      max-width: 900px;
      margin: 80px auto;
      padding: 0 40px;
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #555;
      max-width: 700px;
      margin: 0 auto 30px auto;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .primary {
      background: #4f46e5;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Welcome to Rhea's Website</h1>
    <p>
      Hi, I’m Rhea and it's nice to see you here. This is a place where I will show you about me from various angles, so feel free to explore around!
    </p>

    <div class="buttons">
      <a class="button primary" href="about.html">About Me</a>
      <a class="button secondary" href="portfolio.html">Portfolio</a>
    </div>
  </main>
</body>
</html>
